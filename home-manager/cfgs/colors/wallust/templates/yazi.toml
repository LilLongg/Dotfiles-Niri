[mgr]
cwd = { fg = "{{ color6 }}" }

find_keyword = { bold = true, fg = "{{ color3 }}" }
find_position = { fg = "{{ color5 }}" }

marker_copied = { fg = "{{ color2 }}", bg = "{{ color2 }}" }
marker_cut = { fg = "{{ color1 }}", bg = "{{ color1 }}" }
marker_selected = { fg = "{{ color3 }}", bg = "{{ color3 }}" }

count_copied = { fg = "{{ color0 }}", bg = "{{ color2 }}" }
count_cut = { fg = "{{ color0 }}", bg = "{{ color1 }}" }
count_selected = { fg = "{{ color0 }}", bg = "{{ color3 }}" }

border_style = { fg = "{{ color4 }}" }

[tabs]
active = { fg = "{{ color0 }}", bg = "{{ color4 }}" }
inactive = { fg = "{{ color4 }}", bg = "{{ color0 | saturate(0.2) }}" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[mode]
normal_main = { fg = "{{ color0 }}", bg = "{{ color4 }}", bold = true }
normal_alt = { fg = "{{ color4 }}", bg = "{{ background | blend(cursor) | blend(background) }}" }

select_alt = { fg = "{{ color5 }}", bg = "{{ background | blend(cursor) | blend(background) }}" }
select_main = { fg = "{{ color0 }}", bg = "{{ color5 }}", bold = true }

unset_main = { fg = "{{ color0 }}", bg = "{{ color1 }}", bold = true }
unset_alt = { fg = "{{ color1 }}", bg = "{{ background | blend(cursor) | blend(background) }}" }

[status]
perm_exec = { fg = "{{ color2 }}" }
perm_read = { fg = "{{ color3 }}" }
perm_sep = { fg = "{{ color6 }}" }
perm_type = { fg = "{{ color4 }}" }
perm_write = { fg = "{{ color1 }}" }

progress_error = { fg = "{{ color1 }}", bg = "{{ color0 }}" }
progress_label = { fg = "{{ color7 }}", bg = "{{ color0 }}" }
progress_normal = { fg = "{{ color7 }}", bg = "{{ color0 }}" }

[pick]
active = { fg = "{{ color5 }}" }
border = { fg = "{{ color4 }}" }
inactive = { fg = "{{ color7 }}" }

[task]
title = { fg = "{{ color4 }}" }
border = { fg = "{{ color4 }}" }
hovered = { fg = "{{ color7 }}", bg = "{{ background | blend(cursor) | blend(background) }}" }

[input]
border = { fg = "{{ color4 }}" }
selected = { bg = "{{ background | blend(cursor) | blend(background) }}" }

[help]
desc = { fg = "{{ color7 }}" }
on = { fg = "{{ color6 }}" }
run = { fg = "{{ color5 }}" }
hovered = { reversed = true, bold = true }
footer = { fg = "{{ background | blend(cursor) | blend(background) }}", bg = "{{ color7 }}" }

[which]
mask = { bg = "{{ background | blend(cursor) | blend(background) }}" }
desc = { fg = "{{ color7 }}" }
cand = { fg = "{{ color6 }}" }
rest = { fg = "{{ cursor }}" }

separator_style = { fg = "{{ color8 | saturate(0.2) }}" }

[notify]
title_info = { fg = "{{ color6 }}" }
title_warn = { fg = "{{ color3 }}" }
title_error = { fg = "{{ color1 }}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{ color6 }}" },
  { mime = "{audio, video}/*", fg = "{{ color3 }}" },

  { mime = "application/{pdf,doc,rtf}", fg = "{{ color2}}" },

  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*},", fg = "{{ color5 }}" },

  { mime = "*", is = "orphan", bg = "{{ color2 | darken(0.2) }}" },
  { mime = "*", is = "exec", fg = "{{ color4 | lighten(0.1) }}" },

  { url = "*/", fg = "{{ color4 }}" },
  { mime = "*", fg = "{{ color7 }}" },
]
